# =============================================================================
# tc_http_server 进程配置（与可执行文件同目录或 argv[1] 指定路径）
# 键值对格式 key=value；Nginx 将 /api/* 反代到本文件的 HttpPort
# =============================================================================
# config format spec
# this is a commet
HttpListenIP=0.0.0.0
HttpPort=8081

# 线程池大小
ThreadNum=8
#   trace debug info warn err critical off
# 测试性能的时候改为warn级别
log_level=info

# 是否开启短链, 主要是图片分享地址，如果开启需要设置shorturl-server grpc服务地址
# 课程前期先禁用短链,避免一上来就把课程搞复杂
enable_shorturl=1
# 因为当前部署是同一台机器所以使用127.0.0.1，注意端口和shorturl-server保持一致
shorturl_server_address=127.0.0.1:50051
shorturl_server_access_token=e8n05nr9jey84prEhw5u43th0yi294780yjr3h7sksSdkFdDngKi

# FastDFS client.conf 路径；storage_web_* 拼出浏览器可访问的文件 URL（group/M00/...）
dfs_path_client=/etc/fdfs/client.conf
storage_web_server_ip=192.168.217.135
storage_web_server_port=8080

#configure for mysql
# 使用 127.0.0.1 而非 localhost，避免客户端走 unix socket 连不到 Docker 映射的 MySQL
DBInstances=tuchuang_master,tuchuang_slave
#tuchuang_master
tuchuang_master_host=127.0.0.1
tuchuang_master_port=3306
tuchuang_master_dbname=tuchuang
tuchuang_master_username=root
tuchuang_master_password=123456
tuchuang_master_maxconncnt=8

#tuchuang_slave
tuchuang_slave_host=127.0.0.1
tuchuang_slave_port=3306
tuchuang_slave_dbname=tuchuang
tuchuang_slave_username=root
tuchuang_slave_password=123456
tuchuang_slave_maxconncnt=8


#configure for token
CacheInstances=token,ranking_list
#token相关
token_host=127.0.0.1
token_port=6379
token_db=0
token_maxconncnt=8

# 排行榜相关，但目前排行也是直接用了token的连接池
ranking_list_host=127.0.0.1
ranking_list_port=6379
ranking_list_db=1
ranking_list_maxconncnt=8
